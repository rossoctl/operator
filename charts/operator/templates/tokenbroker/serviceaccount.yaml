{{- if and .Values.rbac.enable .Values.tokenBroker.enabled }}
# The broker is stateless and calls no Kubernetes API, so it needs no
# Role/RoleBinding — just an identity to run as.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: token-broker
  name: {{ .Values.tokenBroker.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
{{- end -}}
