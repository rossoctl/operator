{{- if .Values.tokenBroker.enabled }}
# Consumed in-cluster at
#   http://token-broker.<namespace>.svc.cluster.local:8190
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: token-broker
  name: token-broker
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: token-broker
  ports:
    - name: http
      port: 8190
      targetPort: http
      protocol: TCP
{{- end -}}
